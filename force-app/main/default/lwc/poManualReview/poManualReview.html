<template>

    <template if:true={isOpen}>
        <section role="dialog"
                 tabindex="-1"
                 aria-modal="true"
                 class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Review Missing Details
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <template if:true={isLoading}>
                        <lightning-spinner
                            alternative-text="Loading"
                            size="medium">
                        </lightning-spinner>
                    </template>

                <div class="review-card">
                    <template if:false={isLoading}>

                        <lightning-input
                            label="PO Number"
                            value={poNumber}
                            disabled={disablePoNumber}
                            onchange={handlePoNumber}>
                        </lightning-input>

                        <br/>

                        <lightning-input
                            label="PO Date"
                            value={poDate}
                            disabled={disablePoDate}
                            onchange={handlePoDate}>
                        </lightning-input>

                        <br/>

                        <lightning-input
                            type="number"
                            label="Amount"
                            value={amount}
                            disabled={disableAmount}
                            onchange={handleAmount}>
                        </lightning-input>

                    </template>

                </div>

                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        icon-name="utility:save"
                        label="Save"
                        class="slds-m-left_small"
                        onclick={saveRecord}
                        disabled={saveDisabled}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
