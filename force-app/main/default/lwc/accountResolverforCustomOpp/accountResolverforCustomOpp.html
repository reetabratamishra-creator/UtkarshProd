<template>
    <lightning-card title="Select Account" icon-name="standard:account">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">

            <template lwc:if={isLoadingDuplicates}>
                <lightning-spinner alternative-text="Checking for duplicates" size="small" variant="brand"></lightning-spinner>
            </template>

            <lightning-radio-group
                name="modeSelector"
                label="How do you want to choose the account?"
                options={modeOptions}
                value={selectedMode}
                type="radio"
                onchange={handleModeChange}>
            </lightning-radio-group>

            <!-- OPTION 1: search / free text -->
            <template lwc:if={isSearchMode}>
                <div class="slds-var-m-top_medium slds-box slds-box_x-small">
                    <div class="slds-form-element">
                        <div class="slds-form-element__control">
                            <div class={comboboxClass}>
                                <div class="slds-combobox__form-element" role="none">
                                    <lightning-input
                                        type="search"
                                        label="Account name"
                                        value={searchTerm}
                                        autocomplete="off"
                                        placeholder="Search existing accounts or type a new name…"
                                        onchange={handleSearchChange}
                                        onblur={handleBlur}>
                                    </lightning-input>
                                </div>
                                <div lwc:if={showDropdown}
                                     class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                     role="listbox">
                                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                        <template for:each={searchResults} for:item="opt">
                                            <li key={opt.Id} role="presentation" class="slds-listbox__item">
                                                <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                                     role="option"
                                                     data-id={opt.Id}
                                                     data-name={opt.Name}
                                                     onmousedown={handleOptionSelect}>
                                                    <span class="slds-media__figure slds-listbox__option-icon">
                                                        <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-media__body">
                                                        <span class="slds-listbox__option-text slds-listbox__option-text_entity">{opt.Name}</span>
                                                        <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">{opt.Phone} {opt.Email__c}</span>
                                                    </span>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-var-m-top_x-small">
                        <template lwc:if={isSearching}>
                            <lightning-spinner alternative-text="Searching" size="small" variant="brand"></lightning-spinner>
                        </template>
                        <template lwc:if={searchSelected}>
                            <lightning-badge label="Existing account selected"></lightning-badge>
                            <lightning-button variant="base" label="Clear" onclick={handleClearSearch}
                                              class="slds-var-m-left_small"></lightning-button>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-body_small slds-text-color_weak">
                                No existing account selected — the typed name will be used to create a new account.
                            </p>
                        </template>
                    </div>
                </div>
            </template>

            <!-- OPTION 2: duplicate picklist -->
            <template lwc:if={isDuplicateMode}>
                <div class="slds-var-m-top_medium slds-box slds-box_x-small">
                    <template lwc:if={hasDuplicates}>
                        <lightning-combobox
                            name="duplicateAccount"
                            label="Matched duplicate accounts"
                            placeholder="Select an account"
                            options={duplicateOptions}
                            value={selectedDuplicateId}
                            onchange={handleDuplicateChange}>
                        </lightning-combobox>
                    </template>
                    <template lwc:else>
                        <div class="slds-text-color_weak slds-text-body_small">
                            No duplicate accounts were found for the entered phone, email or name.
                        </div>
                    </template>
                    <template lwc:if={duplicateError}>
                        <div class="slds-text-color_error slds-text-body_small slds-var-m-top_x-small">{duplicateError}</div>
                    </template>
                </div>
            </template>

            <template lwc:if={showAddressSelector}>
                <c-address-book-selector
                    account-id={selectedAccountId}
                    onaddressselected={handleAddressSelected}>
                </c-address-book-selector>
            </template>

        </div>
    </lightning-card>
</template>
