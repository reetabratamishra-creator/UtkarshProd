<template>
    <div class="slds-box slds-theme_default main-container slds-m-around_medium">
        
        <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end slds-m-bottom_medium">
            
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5 slds-p-bottom_small">
                <template lwc:if={showSubTypeSelection}>
                    <lightning-combobox
                        name="subType"
                        label="Template Sub-Type"
                        value={selectedSubType}
                        placeholder="Select Template Type"
                        options={subTypeOptions}
                        onchange={handleSubTypeChange}
                        class="slds-m-bottom_none">
                    </lightning-combobox>
                </template>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-5 slds-p-bottom_small">
                <div class="slds-grid slds-gutters slds-wrap">
                    
                    <div class="slds-col slds-size_1-of-3">
                        <div class={pdfCardClass} data-format="pdf" onclick={handleFormatSelect} style="padding: 4px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                            <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                            <div class="format-label" style="font-size: 11px; margin-top: 2px;">PDF</div>
                        </div>
                    </div>
                    
                    <div class="slds-col slds-size_1-of-3">
                        <div class={excelCardClass} data-format="excel" onclick={handleFormatSelect} style="padding: 4px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                            <lightning-icon icon-name="doctype:excel" size="small"></lightning-icon>
                            <div class="format-label" style="font-size: 11px; margin-top: 2px;">Excel</div>
                        </div>
                    </div>
                    
                    <div class="slds-col slds-size_1-of-3">
                        <div class={wordCardClass} data-format="word" onclick={handleFormatSelect} style="padding: 4px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                            <lightning-icon icon-name="doctype:word" size="small"></lightning-icon>
                            <div class="format-label" style="font-size: 11px; margin-top: 2px;">Word</div>
                        </div>
                    </div>
                    
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-5 slds-p-bottom_small">
                <lightning-button 
                    label={buttonLabel} 
                    icon-name="utility:download" 
                    variant="brand" 
                    disabled={exportDisabled}
                    onclick={generateDocument}
                    class="slds-size_1-of-1"
                    stretch>
                </lightning-button>
                <!-- Download locked until Approved / finalized. Deepanjan (18th September 2026) -->
                <template lwc:if={showDownloadLockedNote}>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-text-align_center">
                        Download is available once the quote is approved.
                    </p>
                </template>
            </div>

        </div>

        <!-- Preview column is DESKTOP-ONLY. On the Salesforce mobile app the VF
             iframe was crash-reloading the webview, and preview mode is off there
             by request - export opens the native file viewer instead.
             Deepanjan (17th July 2026) -->
        <template lwc:if={isDesktop}>
        <div class="preview-container slds-border_top slds-p-top_medium">
            <template lwc:if={showPreview}>
                <div class="slds-box slds-box_xx-small slds-theme_shade" style="height: 650px; width: 100%; padding: 0;">
                    <iframe src={previewUrl} width="100%" height="100%" style="border: none;"></iframe>
                </div>
            </template>
            
            <template lwc:else>
                <div class="slds-illustration slds-illustration_small slds-p-top_xx-large slds-m-top_xx-large">
                    <div class="slds-text-longform slds-text-align_center">
                        <h3 class="slds-text-heading_medium">Preview Not Available</h3>
                        <p class="slds-text-body_regular">A live PDF preview is not configured for this specific template.</p>
                    </div>
                </div>
            </template>
        </div>
        </template>
        
    </div>
</template>
