<template>
    <lightning-card>
        <div class="slds-p-horizontal_medium slds-p-bottom_small">

            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={caseInfo}>
                <p class="slds-m-bottom_x-small">
                    <b>Case Number:</b> {caseInfo.caseNumber}
                </p>
                <p class="slds-m-bottom_x-small">
                    <b>Current Status:</b> {caseInfo.status}
                </p>

                <div class="slds-box slds-theme_shade slds-m-top_small">
                    Status will be set to <b>Open</b>, and the
                    <b>RCA</b> and <b>Preventive Action</b> fields will be cleared.
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
            </template>
        </div>

        <div slot="footer" class="slds-align_absolute-center">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Reopen Case"
                disabled={disableSubmit}
                onclick={handleReopen}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
