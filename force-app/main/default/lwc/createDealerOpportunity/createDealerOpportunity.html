<template>
    <lightning-card title="New Dealer Opportunity" icon-name="standard:opportunity">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Searchable Dealer picker -->
            <div class="slds-form-element">
                <label class="slds-form-element__label" for="dealer-search">
                    <abbr class="slds-required" title="required">*</abbr>Dealer Name
                </label>
                <div class="slds-form-element__control">
                    <div class="slds-combobox_container">
                        <div class={comboboxClass} role="combobox" aria-haspopup="listbox" aria-expanded={showDropdown}>
                            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                <input type="text" id="dealer-search" class="slds-input slds-combobox__input"
                                    role="textbox" autocomplete="off" placeholder="Search dealers..."
                                    value={searchTerm}
                                    onfocus={handleDealerFocus} onblur={handleDealerBlur} oninput={handleDealerSearch} />
                                <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                    <lightning-icon icon-name="utility:search" size="x-small" alternative-text="Search"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                    <template for:each={filteredDealers} for:item="opt">
                                        <li key={opt.value} role="presentation" class="slds-listbox__item">
                                            <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                role="option" data-id={opt.value} data-name={opt.label}
                                                onmousedown={handleDealerSelect}>
                                                <span class="slds-media__body">
                                                    <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                                                </span>
                                            </div>
                                        </li>
                                    </template>
                                    <template if:true={noResults}>
                                        <li role="presentation" class="slds-listbox__item">
                                            <div class="slds-media slds-listbox__option slds-listbox__option_plain">
                                                <span class="slds-media__body slds-text-color_weak">No matching dealers</span>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <template if:true={selectedDealerId}>
                <div class="slds-box slds-box_x-small slds-m-vertical_small slds-theme_shade">
                    <p><strong>Phone:</strong> {dealerPhone}</p>
                    <p><strong>Email:</strong> {dealerEmail}</p>
                    <template if:true={hasContact}>
                        <p><strong>Contact Role:</strong> {contactName}</p>
                    </template>
                    <template if:false={hasContact}>
                        <p class="slds-text-color_error">No contact found on this dealer — no Contact Role will be created.</p>
                    </template>
                </div>
            </template>

            <lightning-input type="date" label="Expected Closure Date" value={closeDate}
                onchange={handleCloseDateChange} required
                message-when-value-missing="Please enter the expected closure date."></lightning-input>

            <lightning-input type="number" formatter="currency" step="0.01" label="Expected Deal Value"
                value={amount} onchange={handleAmountChange} required
                message-when-value-missing="Please enter the expected deal value."></lightning-input>

            <lightning-combobox label="Industry" placeholder="Select Industry" options={industryOptions}
                value={industry} onchange={handleIndustryChange}></lightning-combobox>
        </div>

        <div slot="footer" class="slds-text-align_right">
            <lightning-button variant="brand" label="Create Opportunity" onclick={handleSave}
                disabled={isSaveDisabled}></lightning-button>
        </div>
    </lightning-card>
</template>
