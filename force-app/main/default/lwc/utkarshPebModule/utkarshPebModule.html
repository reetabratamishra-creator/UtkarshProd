<template>
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate" style="font-weight: bold; color: #0176d3;">PEB Module Configuration</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input type="file" label="1. Building Description" accept=".pdf,.doc,.docx" required onchange={handleBuildingFileChange}></lightning-input>
                            <template lwc:if={buildingFileName}>
                                <div class="slds-text-color_success slds-m-top_xx-small">📄 {buildingFileName}</div>
                                
                                <lightning-button-icon 
                                    icon-name="utility:magicwand" 
                                    variant="brand" 
                                    title="Auto-Fill Accessories from Document" 
                                    onclick={extractDataFromPDF}
                                    class="slds-m-top_x-small">
                                </lightning-button-icon>
                                <span class="slds-m-left_x-small slds-text-body_small" style="color: #0176d3; font-weight: bold;">Extract Accessories</span>
                            </template>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input type="file" label="2. Estimation PDF" accept=".pdf" required onchange={handleEstimationFileChange}></lightning-input>
                            <template lwc:if={estimationFileName}><div class="slds-text-color_success slds-m-top_xx-small">📄 {estimationFileName}</div></template>
                        </div>
                    </div>

                    <div class="slds-section slds-is-open slds-m-bottom_medium">
                        <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small" style="border-radius: 4px;">
                            <span class="slds-truncate" title="Accessories Table">Extracted Accessories &amp; Buyouts</span>
                        </h3>
                        
                        <template lwc:if={hasAccessories}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_small slds-table_fixed-layout">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 4rem;"><div class="slds-truncate" title="Select">Select</div></th>
                                        <th scope="col" style="width: 35%;"><div class="slds-truncate" title="Description">Description</div></th>
                                        <th scope="col"><div class="slds-truncate" title="Size">Size</div></th>
                                        <th scope="col" style="width: 15%;"><div class="slds-truncate" title="Quantity">Quantity</div></th>
                                        <th scope="col"><div class="slds-truncate" title="Remark">Remark</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={accessoriesList} for:item="acc">
                                        <tr key={acc.id}>
                                            <td>
                                                <lightning-input type="checkbox" checked={acc.selected} data-id={acc.id} onchange={handleAccessorySelect}></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="text" value={acc.description} variant="label-hidden" data-id={acc.id} data-field="description" onchange={handleAccessoryChange}></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="text" value={acc.size} variant="label-hidden" data-id={acc.id} data-field="size" onchange={handleAccessoryChange}></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="text" value={acc.quantity} variant="label-hidden" data-id={acc.id} data-field="quantity" onchange={handleAccessoryChange}></lightning-input>
                                            </td>
                                            <td>
                                                <lightning-input type="text" value={acc.remark} variant="label-hidden" data-id={acc.id} data-field="remark" onchange={handleAccessoryChange}></lightning-input>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:else>
                            <div class="slds-text-color_weak slds-m-top_small slds-p-left_small" style="font-style: italic;">
                                Upload the Building Description PDF and click the magic wand to extract the accessories table.
                            </div>
                        </template>
                    </div>
<!--
                    <div class="slds-section slds-is-open slds-m-bottom_medium">
                        <h3 class="slds-section__title slds-theme_shade slds-p-around_x-small" style="border-radius: 4px;">
                            <span class="slds-truncate" title="Terms & Conditions">Terms & Conditions</span>
                        </h3>
                        <div class="slds-grid slds-gutters slds-m-top_small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="text" label="Reference (Ref)" value={termsRef} data-field="termsRef" onchange={handleInputChange}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input type="date" label="Date" value={termsDate} data-field="termsDate" onchange={handleInputChange}></lightning-input>
                            </div>
                        </div>
                    </div>
                    -->

                    

                    <template lwc:if={errorMessage}>
                        <div class="slds-text-color_error slds-m-bottom_small slds-text-align_right" style="font-weight: bold;">{errorMessage}</div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={closeModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button label="Apply" variant="brand" onclick={handleApply} class="slds-m-right_small"></lightning-button>
                    <!--
                    <template lwc:if={isApplied}>
                        <lightning-button label="Generate Quote Doc (Bank Doc)" variant="success" icon-name="utility:file" onclick={handleGenerateBankDoc}></lightning-button>
                    </template>
                    -->
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
