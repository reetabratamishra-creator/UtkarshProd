<template>
    <lightning-card title="Tender Actions" icon-name="standard:record">

        <div class="slds-p-around_medium">

            <!-- HOD Choice -->
            <template lwc:if={showHodChoice}>
            <div class="slds-box slds-theme_default slds-m-bottom_large">
                <div class="slds-text-title_bold slds-m-bottom_x-small">
                    HOD Choice
                </div>

                <div class="slds-text-heading_small">
                    {hodChoice}
                </div>
            </div>
            </template>

            
            <template lwc:if={hodCommentList.length}>
                <h1>HOD Comments:</h1>
                <div class="slds-box slds-m-bottom_medium">
                    <div class="slds-text-title_bold slds-m-bottom_x-small">HOD Comments</div>
                    <ul class="slds-list_vertical">
                        <template for:each={hodCommentList} for:item="c">
                            <li key={c.key} class="slds-p-vertical_xx-small">{c.text}</li>
                        </template>
                    </ul>
                </div>
            </template>


            <!-- Action Buttons -->
            <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_large slds-grid_align-center">
                <template for:each={displayedChoiceOptions} for:item="opt">
                    <div key={opt.value} class="slds-m-bottom_small">
                        <lightning-button
                            label={opt.label}
                            data-value={opt.value}
                            variant={opt.variant}
                            onclick={handleDynamicChoiceClick}
                            disabled={isButtonsDisabled}>
                        </lightning-button>
                    </div>
                </template>
            </div>

            <!-- Accept Section -->
            <template lwc:if={showAcceptSection}>
                <div class="slds-box slds-theme_default slds-m-bottom_large">

                    <div class="slds-text-title_bold slds-m-bottom_small">
                        Authority Account
                    </div>

                    <div class="slds-text-body_regular">
                        {authorityName}
                    </div>

                    <div class="slds-text-title_bold slds-m-bottom_small">
                        Contact
                    </div>

                    <div class="slds-text-body_regular">
                          {contactDisplay}
                    </div>

                    <div class="slds-text-title_bold slds-m-bottom_small">
                        Address Book
                    </div>

                    <template lwc:if={hasAddressBookData}>
                        <div class="slds-box slds-theme_default slds-m-bottom_large">
                            <div class="slds-text-title_bold slds-m-bottom_small">Address Book</div>
                            <lightning-datatable
                                key-field="Id"
                                data={addressBookData}
                                columns={addressBookColumns}
                                hide-checkbox-column>
                            </lightning-datatable>
                        </div>
                    </template>

                    <lightning-textarea
                        class="slds-m-top_medium"
                        label="Notes"
                        value={acceptNotes}
                        onchange={handleAcceptNotesChange}
                        required>
                    </lightning-textarea>

                    <template lwc:if={isResendScenario}>
                          
                            <lightning-combobox
                                class="slds-m-top_medium"
                                label="Select Owner"
                                placeholder="Select a Owner"
                                options={projectOwnerOptions}
                                value={selectedProjectOwnerId}
                                onchange={handleProjectOwnerChange}
                                required>
                            </lightning-combobox>
                        
                    </template>


                    <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button
                            variant="brand"
                            label="Submit"
                            onclick={handleAcceptSubmit}>
                        </lightning-button>
                    </div>

                </div>
            </template>

            <!-- Rejection Section -->
            <template lwc:if={showRejectionReason}>

                <div class="slds-box slds-theme_default slds-m-bottom_large">

                    <lightning-textarea
                        label="Rejection Reason"
                        value={rejectionReason}
                        onchange={handleReasonChange}
                        required>
                    </lightning-textarea>

                    
                    <div class="slds-m-top_medium slds-text-align_right">

                        <lightning-button
                            variant="brand"
                            label="Submit"
                            onclick={handleRejectSubmit}>
                        </lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            label="Cancel"
                            onclick={handleRejectCancel}>
                        </lightning-button>

                    </div>

                </div>

            </template>

            <!-- Spinner -->
            <template lwc:if={isProcessing}>
                <div class="slds-is-relative slds-p-vertical_medium">
                    <lightning-spinner
                        alternative-text="Processing..."
                        size="small">
                    </lightning-spinner>
                </div>
            </template>

            <!-- No Account Message -->
            <template lwc:if={showModal}>
                <div class="slds-box slds-theme_alert-texture slds-theme_warning slds-m-top_medium">

                    <div class="slds-text-heading_small slds-m-bottom_small">
                        Authority Account Missing
                    </div>

                    <p>
                        No Account is set on this Tender's Authority field.
                        Please update the Authority before proceeding.
                    </p>

                    <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button
                            variant="neutral"
                            label="OK"
                            onclick={handleCancelModal}>
                        </lightning-button>
                    </div>

                </div>
            </template>

        </div>

    </lightning-card>
</template>
