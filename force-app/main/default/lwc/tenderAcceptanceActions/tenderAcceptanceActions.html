<template>
    <lightning-card title="Tender Actions" icon-name="standard:record">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-button-group>
                <lightning-button
                    variant="brand"
                    label="Send for Acceptance"
                    onclick={handleButtonAClick}
                    disabled={isButtonsDisabled}
                ></lightning-button>
                <lightning-button
                    variant="destructive-text"
                    label="Reject and Create Project"
                    onclick={handleButtonRejectProjectClick}
                    disabled={isButtonsDisabled}
                ></lightning-button>
                <lightning-button
                    variant="destructive-text"
                    label="Reject and Close"
                    onclick={handleButtonRejectCloseClick}
                    disabled={isButtonsDisabled}
                ></lightning-button>
            </lightning-button-group>

            <template lwc:if={isProcessing}>
                <div class="slds-p-top_small">
                    <lightning-spinner alternative-text="Working..." size="small"></lightning-spinner>
                </div>
            </template>
        </div>

        <!-- Modal for Button A flow -->
        <template lwc:if={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Send for Acceptance</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- Step: no account on record -->
                        <template lwc:if={isStepNoAccount}>
                            <p class="slds-text-color_error">
                                No Account is set on this record's Authority field. Please select or set an
                                Account on this record before continuing.
                            </p>
                        </template>

                        <!-- Step: confirm account -->
                        <template lwc:if={isStepAccount}>
                            <p>Related Account:</p>
                            <p class="slds-text-heading_small slds-p-vertical_x-small">{authorityName}</p>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Click Continue to choose or create a Contact for this Account.
                            </p>
                        </template>

                        <!-- Step: select or create contact -->
                        <template lwc:if={isStepContact}>
                            <lightning-combobox
                                label="Select Contact"
                                placeholder="Choose a Contact"
                                options={contactOptions}
                                value={selectedContactValue}
                                onchange={handleContactSelectionChange}
                            ></lightning-combobox>

                            <template lwc:if={showCreateForm}>
                                <div class="slds-p-top_small">
                                    <lightning-input
                                        label="First Name"
                                        data-field="firstName"
                                        value={newContact.firstName}
                                        onchange={handleNewContactFieldChange}
                                    ></lightning-input>
                                    <lightning-input
                                        label="Last Name"
                                        data-field="lastName"
                                        required
                                        value={newContact.lastName}
                                        onchange={handleNewContactFieldChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="email"
                                        label="Email"
                                        data-field="email"
                                        value={newContact.email}
                                        onchange={handleNewContactFieldChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="tel"
                                        label="Phone"
                                        data-field="phone"
                                        value={newContact.phone}
                                        onchange={handleNewContactFieldChange}
                                    ></lightning-input>
                                </div>
                            </template>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleCancelModal}
                            disabled={isProcessing}
                        ></lightning-button>

                        <template lwc:if={isStepAccount}>
                            <lightning-button
                                variant="brand"
                                label="Continue"
                                onclick={handleAccountContinue}
                                disabled={isProcessing}
                            ></lightning-button>
                        </template>

                        <template lwc:if={isStepContact}>
                            <lightning-button
                                variant="brand"
                                label="Confirm"
                                onclick={handleConfirmContact}
                                disabled={isProcessing}
                            ></lightning-button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
