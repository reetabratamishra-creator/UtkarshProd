<template>
    <lightning-card title="Expense Lines" icon-name="standard:orders">
        <div slot="actions">
            <lightning-button 
                label="Add Expense Line" 
                onclick={handleAddNew}
                variant="brand">
            </lightning-button>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <!-- Total Amount Display -->
            <div class="slds-box slds-theme_info slds-m-bottom_medium">
                <div class="slds-text-heading_medium">
                    Total Amount: <lightning-formatted-number 
                        value={totalAmount} 
                        format-style="currency" 
                        currency-code="INR">
                    </lightning-formatted-number>
                </div>
            </div>

            <!-- Expense Lines Data Table -->
            <template if:true={hasLines}>
                <lightning-datatable
                    key-field="Id"
                    data={lines}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>

            <template if:false={hasLines}>
                <div class="slds-text-align_center slds-p-vertical_large">
                    <p class="slds-text-body_regular">No expense lines added yet.</p>
                    <p class="slds-text-color_weak">Click "Add Expense Line" to get started.</p>
                </div>
            </template>
        </div>

        <!-- Add/Edit Modal -->
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form slds-form_stacked">
                            <!-- Date -->
                            <lightning-input 
                                type="date"
                                name="Date__c"
                                label="Date"
                                value={selectedLine.Date__c}
                                onchange={handleFieldChange}
                                required>
                            </lightning-input>

                            <!-- Expense Type -->
                            <lightning-combobox
                                name="Expense_Type__c"
                                label="Expense Type"
                                value={selectedLine.Expense_Type__c}
                                options={expenseTypeOptions}
                                onchange={handleFieldChange}
                                required>
                            </lightning-combobox>

                            <!-- City -->
                            <lightning-input 
                                type="text"
                                name="City__c"
                                label="City"
                                value={selectedLine.City__c}
                                onchange={handleFieldChange}
                                required>
                            </lightning-input>

                            <!-- City Tier -->
                            <lightning-combobox
                                name="City_Tier__c"
                                label="City Tier"
                                value={selectedLine.City_Tier__c}
                                options={cityTierOptions}
                                onchange={handleFieldChange}
                                required>
                            </lightning-combobox>

                            <!-- Travel Class (conditional) -->
                            <template if:true={showTravelClassField}>
                                <lightning-combobox
                                    name="Travel_Class__c"
                                    label="Travel Class"
                                    value={selectedLine.Travel_Class__c}
                                    options={travelClassOptions}
                                    onchange={handleFieldChange}>
                                </lightning-combobox>
                            </template>

                            <!-- Vehicle Type (conditional) -->
                            <template if:true={showVehicleTypeField}>
                                <lightning-combobox
                                    name="Vehicle_Type__c"
                                    label="Vehicle Type"
                                    value={selectedLine.Vehicle_Type__c}
                                    options={vehicleTypeOptions}
                                    onchange={handleFieldChange}>
                                </lightning-combobox>
                            </template>

                            <!-- Distance KM (conditional) -->
                            <template if:true={showDistanceField}>
                                <lightning-input 
                                    type="number"
                                    name="Distance_KM__c"
                                    label="Distance (KM)"
                                    value={selectedLine.Distance_KM__c}
                                    onchange={handleFieldChange}
                                    min="0"
                                    step="0.1">
                                </lightning-input>
                            </template>

                            <!-- Amount -->
                            <lightning-input 
                                type="number"
                                name="Amount__c"
                                label="Amount"
                                value={selectedLine.Amount__c}
                                onchange={handleFieldChange}
                                formatter="currency"
                                required>
                            </lightning-input>

                            <!-- Bill Attached -->
                            <lightning-input 
                                type="checkbox"
                                name="Bill_Attached__c"
                                label="Bill Attached"
                                checked={selectedLine.Bill_Attached__c}
                                onchange={handleFieldChange}>
                            </lightning-input>

                            <!-- Description -->
                            <lightning-textarea
                                name="Description__c"
                                label="Description"
                                value={selectedLine.Description__c}
                                onchange={handleFieldChange}
                                max-length="255">
                            </lightning-textarea>
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button 
                            label="Cancel" 
                            onclick={handleCloseModal}>
                        </lightning-button>
                        <lightning-button 
                            variant="brand" 
                            label="Save" 
                            onclick={handleSave}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
