<template>
    <lightning-card title={formTitle} icon-name="standard:expense">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <lightning-record-edit-form 
                object-api-name={expenseObject}
                record-id={recordId}
                onsuccess={handleSave}>
                
                <!-- Employee Information Section -->
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field 
                            field-name={employeeField}
                            disabled>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input-field 
                            field-name={employeeLevelField}
                            disabled>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input-field 
                            field-name={employeeGradeField}
                            disabled>
                        </lightning-input-field>
                    </div>
                </div>

                <!-- Expense Details Section -->
                <div class="slds-text-heading_small slds-m-bottom_small">
                    Expense Details
                </div>
                
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field 
                            field-name={travelStartDateField}
                            required
                            disabled={isReadOnly}>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field 
                            field-name={travelEndDateField}
                            required
                            disabled={isReadOnly}>
                        </lightning-input-field>
                    </div>
                </div>

                <div class="slds-m-bottom_medium">
                    <lightning-input-field 
                        field-name={purposeField}
                        required
                        disabled={isReadOnly}>
                    </lightning-input-field>
                </div>

                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field 
                            field-name={statusField}
                            disabled>
                        </lightning-input-field>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input-field 
                            field-name={totalAmountField}
                            disabled>
                        </lightning-input-field>
                    </div>
                </div>

                <!-- Eligibility Information Card -->
                <template if:true={eligibility.Level__c}>
                    <div class="slds-box slds-theme_shade slds-m-top_medium">
                        <div class="slds-text-heading_small slds-m-bottom_small">
                            Your Eligibility Limits
                        </div>
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">Lodging (Tier 1):</span>
                                <div class="slds-text-body_regular">₹{eligibility.Lodging_Tier1__c}/day</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">Lodging (Tier 2):</span>
                                <div class="slds-text-body_regular">₹{eligibility.Lodging_Tier2__c}/day</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">Fooding (Tier 1):</span>
                                <div class="slds-text-body_regular">₹{eligibility.Fooding_Tier1__c}/day</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">Fooding (Tier 2):</span>
                                <div class="slds-text-body_regular">₹{eligibility.Fooding_Tier2__c}/day</div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_xx-small">
                                <span class="slds-text-body_small slds-text-color_weak">Own Vehicle:</span>
                                <div class="slds-text-body_regular">₹{eligibility.Own_Vehicle_Rate__c}/KM</div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Action Buttons -->
                <template if:false={isReadOnly}>
                    <div class="slds-m-top_medium">
                        <lightning-button 
                            variant="brand" 
                            type="submit"
                            label="Save"
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button 
                            variant="neutral" 
                            label="Cancel"
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>
                </template>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
