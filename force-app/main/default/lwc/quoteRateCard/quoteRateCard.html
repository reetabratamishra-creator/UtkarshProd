<template>
    <lightning-card title="Quote Rate Card Manager" icon-name="custom:custom63">
        
        <div class="slds-var-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        name="dept"
                        label="Department"
                        value={valueA}
                        placeholder="Select Department"
                        options={optionsA}
                        onchange={handleAChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        name="subType"
                        label="Type / Standard"
                        value={valueB}
                        placeholder="Select Option"
                        options={optionsB}
                        disabled={isBDisabled}
                        onchange={handleBChange}>
                    </lightning-combobox>
                </div>
            </div>
        </div>

        <template if:true={showDataGrid}>
            <div class="slds-var-p-around_medium slds-border_top slds-m-top_medium">
                <!--
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium slds-align-middle">
                    <h2 class="slds-text-heading_small slds-text-title_bold">Review & Edit Rates: {valueB}</h2>
                    <div>
                        <lightning-button label="Upload Excel Instead" icon-name="utility:upload" onclick={openUploadModal}></lightning-button>
                    </div>
                </div>
                -->

                <div class="slds-scrollable slds-m-bottom_medium" style="max-height: 400px; overflow-y: auto; border: 1px solid #c9c9c9; border-radius: 4px;">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th style="width: 50px;" class="slds-color__background_gray-2">#</th>
                                <template for:each={currentColumns} for:item="col">
                                    <th key={col} class="slds-color__background_gray-2">{col}</th>
                                </template>
                                </tr>
                        </thead>
                        <tbody>
                            <template for:each={gridData} for:item="row" for:index="index">
                                <tr key={row.id}>
                                    <td><div class="slds-truncate slds-text-color_weak slds-text-align_center">{row.displayIndex}</div></td>
                                    
                                    <template for:each={row.cells} for:item="cell">
                                        <td key={cell.column}>
                                            <lightning-input
                                                variant="label-hidden"
                                                value={cell.value}
                                                data-row={index}
                                                data-col={cell.column}
                                                onchange={handleCellChange}
                                                read-only={cell.isReadOnly}> </lightning-input>
                                        </td>
                                    </template>

                                    </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="slds-text-align_right">
                    <template if:true={isHighMast}>
                        <lightning-button variant="brand" label="Save High Mast Amounts" icon-name="utility:save" onclick={handleSaveHighMast} disabled={isSaving}></lightning-button>
                    </template>
                    <template if:false={isHighMast}>
                        <lightning-button variant="brand" label="Save Configuration" icon-name="utility:save" onclick={handleSaveGrid} disabled={isSaving}></lightning-button>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Excel Upload</h2>
                </header>
                <div class="slds-modal__content slds-var-p-around_large slds-text-align_center">
                    
                    <div class="slds-form-element">
                        <div class="slds-file-selector slds-file-selector_files">
                            <div class="slds-file-selector__dropzone">
                                <input type="file" class="slds-file-selector__input slds-assistive-text" accept=".xlsx, .xls" id="file-upload-input" onchange={handleFileChange} />
                                <label class="slds-file-selector__body" for="file-upload-input">
                                    <span class="slds-file-selector__button slds-button slds-button_neutral">
                                        <lightning-icon icon-name="utility:upload" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        Choose Excel File
                                    </span>
                                </label>
                            </div>
                        </div>
                        <p class="slds-text-color_weak slds-m-top_small">Supported formats: .xls, .xlsx</p>
                    </div>

                    <template if:true={verificationResults.length}>
                        <div class="slds-var-m-top_medium slds-text-heading_small slds-text-color_weak slds-text-align_left">File Review Log:</div>
                        <div style="height: 200px;" class="slds-text-align_left">
                            <lightning-datatable key-field="id" data={verificationResults} columns={columns} hide-checkbox-column></lightning-datatable>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
