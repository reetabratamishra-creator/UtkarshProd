<template>
    <lightning-card title="My Expenses" icon-name="standard:expense">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                onclick={handleRefresh}
                variant="border-filled">
            </lightning-button-icon>
        </div>

        <!-- Summary -->
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <div class="slds-text-body_regular slds-text-color_weak">
                {expenseCount} expense(s)
                <template if:true={hasRejected}>
                    | <span class="rejected-summary">{rejectedCount} can be edited &amp; resubmitted</span>
                </template>
            </div>
        </div>

        <template if:true={hasExpenses}>
            <div class="custom-table-wrapper">
                <div class="table-scroll-inner">
                    <!-- Header row (hidden on mobile via CSS) -->
                    <div class="table-header" role="row">
                        <div class="th" data-field="Name" onclick={handleSort}>Expense #</div>
                        <div class="th" data-field="Status" onclick={handleSort}>Status</div>
                        <div class="th" data-field="TotalAmount" onclick={handleSort}>Total Amount</div>
                        <div class="th" data-field="Remark" onclick={handleSort}>Remark</div>
                        <div class="th th-action">Action</div>
                    </div>

                    <!-- Rows -->
                    <template for:each={pagedExpenses} for:item="exp">
                        <div key={exp.Id} class="table-row" role="row">
                            <div class="td" data-label="Expense #">
                                <span class="expense-link-wrap">
                                    <a href={exp.recordUrl} class="expense-link" title={exp.linkTitle}
                                        data-id={exp.Id} data-editable={exp.editableFlag}
                                        onclick={handleExpenseClick}>{exp.Name}</a>
                                </span>
                            </div>
                            <div class="td" data-label="Status">
                                <span class={exp.statusBadgeClass}>{exp.Status}</span>
                            </div>
                            <div class="td" data-label="Total Amount">
                                <lightning-formatted-number
                                    value={exp.TotalAmount}
                                    format-style="currency"
                                    currency-code="INR"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                            <div class="td td-remark" data-label="Remark">
                                <span class="remark-text">{exp.remarkText}</span>
                            </div>
                            <template if:true={exp.canEdit}>
                                <div class="td td-action" data-label="Action">
                                    <span class="edit-badge">Edit &amp; Resubmit</span>
                                </div>
                            </template>
                            <template if:false={exp.canEdit}>
                                <div class="td td-action td-action-empty" data-label="Action"></div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Pagination -->
            <template if:true={showPagination}>
                <div class="pagination-bar">
                    <span class="pagination-info">
                        Showing {pageRangeStart}–{pageRangeEnd} of {expenseCount}
                    </span>
                    <div class="pagination-controls">
                        <lightning-button label="Previous" icon-name="utility:chevronleft"
                            onclick={handlePreviousPage} disabled={isFirstPage}>
                        </lightning-button>
                        <span class="pagination-page">Page {currentPage} of {totalPages}</span>
                        <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                            onclick={handleNextPage} disabled={isLastPage}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </template>

        <!-- Empty State -->
        <template if:false={hasExpenses}>
            <div class="slds-p-around_medium">
                <div class="slds-text-align_center">
                    <h3 class="slds-text-heading_medium">No Expenses</h3>
                    <p class="slds-text-body_regular slds-m-top_small">
                        You have not submitted any expenses yet.
                    </p>
                </div>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={error}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>Error loading your expenses. Please try again or contact your administrator.</h2>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
