<template>
    <lightning-card class="full-height-card">
        <lightning-tabset variant="scoped" active-tab-value={activeTab}>

            <lightning-tab label="Overview" icon-name="utility:metrics" value="overview">

                <template if:true={selectedDashboardTarget}>
                    <div class="dashboard-wrapper">

                        <div class="overview-filter-bar slds-m-bottom_medium">
                            <div class="filter-col filter-target">
                                <label class="filter-label">Target</label>
                                <lightning-combobox value={selectedTargetId} options={targetDropdownOptions}
                                    onchange={handleTargetChange} variant="label-hidden"
                                    class="filter-combobox"></lightning-combobox>
                            </div>
                            <div class="filter-col filter-cycle">
                                <label class="filter-label">Cycle Period</label>
                                <lightning-combobox value={selectedCycle} options={cycleDropdownOptions}
                                    onchange={handleCycleChange} variant="label-hidden"
                                    class="filter-combobox"></lightning-combobox>
                            </div>
                        </div>

                        <div class="header-stats-card slds-m-bottom_medium">
                            <div class="header-stats-grid">

                                <div class="header-stat-item stat-item-achievement">
                                    <div class="stat-label">Achievement</div>
                                    <div class="stat-ring-wrap">
                                        <lightning-progress-ring value={overallAchievement} size="large"
                                            variant="warning"></lightning-progress-ring>
                                    </div>
                                    <div class="stat-achievement-number">
                                        <b>{overallAchievement}%</b>
                                    </div>
                                </div>

                                <div class="header-stat-item stat-item-target">
                                    <div class="stat-label">Target Name</div>
                                    <div class="stat-target-name" title={selectedDashboardTarget.Name}>
                                        <b>{selectedDashboardTarget.Name}</b>
                                    </div>
                                    <span class="blue-badge">For - {selectedDashboardTarget.Assign_To_Type__c}</span>
                                </div>

                                <div class="header-stat-item stat-item-module">
                                    <div class="stat-label">Module & Metric</div>
                                    <div class="stat-line"><b>Module:</b> {selectedDashboardTarget.Target_Module__c}</div>
                                    <div class="stat-line"><b>Metric:</b> {selectedDashboardTarget.Metric__c}</div>
                                </div>

                                <div class="header-stat-item stat-item-cycle">
                                    <div class="stat-label">Current Cycle</div>
                                    <div class="stat-cycle-value"><b>{currentCycleDisplay}</b></div>
                                </div>

                                <div class="header-stat-item stat-item-frequency">
                                    <div class="stat-label">Frequency</div>
                                    <div class="stat-freq-value">{selectedDashboardTarget.Frequency__c}</div>
                                </div>

                            </div>
                        </div>

                        <div class="slds-grid slds-gutters_medium">

                            <div class="slds-col slds-size_1-of-2">
                                <div class="slds-box slds-box_xx-small slds-theme_default list-card">
                                    <div
                                        class="slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                        <div class="slds-text-heading_small"><b>Targets</b></div>
                                    </div>

                                    <div
                                        class="slds-grid slds-grid_align-spread slds-p-horizontal_small slds-p-top_small slds-text-color_weak slds-text-body_small">
                                        <div>Employee &#8693;</div>
                                        <div>Targets &#8693;</div>
                                    </div>

                                    <ul class="slds-p-around_small slds-scrollable_y" style="max-height: 400px;">
                                        <template if:false={dashboardEmployees.length}>
                                            <div class="slds-p-around_small slds-text-align_center">No targets to track
                                                for this cycle.</div>
                                        </template>
                                        <template for:each={dashboardEmployees} for:item="emp">
                                            <li key={emp.id}
                                                class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium">
                                                <div
                                                    class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical-align-center">
                                                    <span
                                                        class="avatar-initials slds-m-right_small">{emp.initials}</span>
                                                    <span class="slds-truncate"
                                                        style="max-width: 200px;"><b>{emp.name}</b></span>
                                                </div>
                                                <div
                                                    class="slds-col slds-size_1-of-2 slds-grid slds-grid_vertical-align-center slds-grid_align-end">
                                                    <div class="dash-progress-track slds-m-right_small">
                                                        <div class="dash-progress-bar" style={emp.progressStyle}></div>
                                                    </div>
                                                    <div class="slds-text-body_small"><b>{emp.progressText}</b></div>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-2">

                              <div class="slds-box slds-box_xx-small slds-theme_default slds-m-bottom_medium">
                                    <div class="slds-grid slds-grid_align-spread slds-p-around_small">
                                        <div class="slds-text-heading_small"><b>Trend Lines</b></div>
                                        <!-- <lightning-button icon-name="utility:download" label="Download as CSV" variant="base"></lightning-button> -->
                                    </div>
                                    
                                    <div class="slds-p-horizontal_medium slds-p-top_small" style="height: 200px; position: relative; width: 100%;">
                                        <canvas class="trend-chart" lwc:dom="manual"></canvas>
                                    </div>
                                    
                                    <div class="slds-p-bottom_small slds-text-body_small slds-text-align_center" style="color: #0176D3;">
                                        <b>{currentCycleDisplay}</b>
                                    </div>
                                </div>

                                <div class="slds-grid slds-gutters_small">

                                    <div class="slds-col slds-size_1-of-2">
                                        <div class="slds-box slds-box_xx-small slds-theme_default perf-card">
                                            <div
                                                class="slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                                <div class="slds-text-heading_small"><b>Top 3 Performers</b></div>
                                                <lightning-button-icon icon-name="utility:expand_alt"
                                                    variant="bare"></lightning-button-icon>
                                            </div>
                                            <ul class="slds-p-around_small">
                                                <template for:each={topPerformers} for:item="tp">
                                                    <li key={tp.id}
                                                        class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <span class="slds-truncate"
                                                                style="max-width: 120px;">{tp.name}</span>
                                                        </div>
                                                        <div><b>{tp.perc}</b></div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>

                                    <div class="slds-col slds-size_1-of-2">
                                        <div class="slds-box slds-box_xx-small slds-theme_default perf-card">
                                            <div
                                                class="slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                                <div class="slds-text-heading_small"><b>Bottom 3 Performers</b></div>
                                                <lightning-button-icon icon-name="utility:expand_alt"
                                                    variant="bare"></lightning-button-icon>
                                            </div>
                                            <ul class="slds-p-around_small">
                                                <template for:each={bottomPerformers} for:item="bp">
                                                    <li key={bp.id}
                                                        class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <span class="slds-truncate"
                                                                style="max-width: 120px;">{bp.name}</span>
                                                        </div>
                                                        <div><b>{bp.perc}</b></div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div> <div class="slds-grid slds-gutters_medium slds-m-top_medium">
                            
                            <div class="slds-col slds-size_2-of-3">
                                <div class="slds-box slds-box_xx-small slds-theme_default perf-card">
                                    <div class="slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                        <div class="slds-text-heading_small"><b>Team Target vs Actual</b></div>
                                    </div>
                                    <div class="slds-p-around_medium" style="height: 250px; position: relative; width: 100%;">
                                        <canvas class="bar-chart" lwc:dom="manual"></canvas>
                                    </div>
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-3">
                                <div class="slds-box slds-box_xx-small slds-theme_default perf-card">
                                    <div class="slds-grid slds-grid_align-spread slds-p-around_small slds-border_bottom">
                                        <div class="slds-text-heading_small"><b>Total Cycle Completion</b></div>
                                    </div>
                                    <div class="slds-p-around_medium" style="height: 250px; position: relative; width: 100%;">
                                        <canvas class="doughnut-chart" lwc:dom="manual"></canvas>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>
                </template>

                <template if:false={selectedDashboardTarget}>
                    <div
                        class="slds-p-around_medium slds-text-align_center slds-text-color_weak slds-box slds-theme_default slds-m-around_medium">
                        <p>No Target Selected. Select a target to view the dashboard.</p>
                    </div>
                </template>
            </lightning-tab>

            <template if:true={isTargetManager}>
                <lightning-tab label="Targets" icon-name="utility:bullseye" value="targets">

                    <template if:false={isCreatingTarget}>
                        <div class="targets-header-bar slds-p-bottom_medium slds-p-horizontal_medium">
                            <div class="targets-header-info">
                                <h2 class="targets-header-title">
                                    Targets <span class="targets-count-pill">{existingTargets.length}</span>
                                </h2>
                                <p class="targets-header-subtitle">View, configure, and manage target allocations across teams and employees</p>
                            </div>
                            <lightning-button label="+ Add Target" variant="brand"
                                class="btn-add-target" onclick={handleAddTarget}></lightning-button>
                        </div>

                        <template if:true={existingTargets.length}>
                            <div class="targets-view-wrapper slds-m-horizontal_medium">
                                <!-- Desktop Custom Table View (screens > 768px) -->
                                <div class="custom-desktop-table-container">
                                    <table class="custom-desktop-table">
                                        <thead>
                                            <tr>
                                                <th scope="col" class="th-name">Target Name</th>
                                                <th scope="col" class="th-module">Module</th>
                                                <th scope="col" class="th-assigned">Assigned To</th>
                                                <th scope="col" class="th-created">Created By</th>
                                                <th scope="col" class="th-status">Status</th>
                                                <th scope="col" class="th-actions slds-text-align_right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={existingTargets} for:item="target">
                                                <tr key={target.Id} class="custom-desktop-tr">
                                                    <td class="td-name">
                                                        <div class="target-name-cell">
                                                            <div class="target-icon-badge">
                                                                <lightning-icon icon-name="utility:target" size="x-small"></lightning-icon>
                                                            </div>
                                                            <span class="target-name-text" title={target.Name}>{target.Name}</span>
                                                        </div>
                                                    </td>
                                                    <td class="td-module">
                                                        <span class="module-chip">{target.Target_Module__c}</span>
                                                    </td>
                                                    <td class="td-assigned">
                                                        <div class="assigned-cell">
                                                            <span class="assigned-names-text" title={target.assignedToDisplay}>{target.assignedToDisplay}</span>
                                                            <template if:true={target.hasExtra}>
                                                                <span class="extra-count-badge" title={target.extraCountText}>{target.extraCountText}</span>
                                                            </template>
                                                        </div>
                                                    </td>
                                                    <td class="td-created">
                                                        <div class="created-cell">
                                                            <strong class="created-name">{target.createdByName}</strong>
                                                            <span class="created-date">{target.createdOnDisplay}</span>
                                                        </div>
                                                    </td>
                                                    <td class="td-status">
                                                        <span class={target.statusClass}>
                                                            <span class="status-indicator-dot"></span>
                                                            {target.Status__c}
                                                        </span>
                                                    </td>
                                                    <td class="td-actions slds-text-align_right">
                                                        <div class="actions-button-group">
                                                            <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                                                alternative-text="Edit Target" title="Edit"
                                                                class="action-btn action-btn-edit" data-id={target.Id}
                                                                onclick={handleEdit}></lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                                                alternative-text="Delete Target" title="Delete"
                                                                class="action-btn action-btn-delete" data-id={target.Id}
                                                                onclick={handleDelete}></lightning-button-icon>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                    <div class="custom-table-footer">
                                        <span class="total-count-text">Total Targets: <strong>{existingTargets.length}</strong></span>
                                    </div>
                                </div>

                                <!-- Mobile Cards View (screens <= 768px) -->
                                <div class="custom-mobile-cards-container">
                                    <template for:each={existingTargets} for:item="target">
                                        <div key={target.Id} class="mobile-target-card">
                                            <!-- Card Header: Name and Status Badge -->
                                            <div class="mobile-card-header">
                                                <div class="mobile-card-title-group">
                                                    <div class="mobile-target-icon-badge">
                                                        <lightning-icon icon-name="utility:target" size="x-small"></lightning-icon>
                                                    </div>
                                                    <span class="mobile-card-title">{target.Name}</span>
                                                </div>
                                                <span class={target.statusClass}>
                                                    <span class="status-indicator-dot"></span>
                                                    {target.Status__c}
                                                </span>
                                            </div>

                                            <!-- Card Body: Structured Metadata with Borders & Spacing -->
                                            <div class="mobile-card-body">
                                                <div class="mobile-info-row">
                                                    <span class="mobile-info-label">
                                                        <lightning-icon icon-name="utility:layers" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                        Module
                                                    </span>
                                                    <span class="mobile-info-value">
                                                        <span class="module-chip">{target.Target_Module__c}</span>
                                                    </span>
                                                </div>

                                                <div class="mobile-info-row">
                                                    <span class="mobile-info-label">
                                                        <lightning-icon icon-name="utility:groups" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                        Assigned To
                                                    </span>
                                                    <span class="mobile-info-value">
                                                        <span class="assigned-names-text">{target.assignedToDisplay}</span>
                                                        <template if:true={target.hasExtra}>
                                                            <span class="extra-count-badge slds-m-left_xx-small">{target.extraCountText}</span>
                                                        </template>
                                                    </span>
                                                </div>

                                                <div class="mobile-info-row">
                                                    <span class="mobile-info-label">
                                                        <lightning-icon icon-name="utility:user" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                        Created By
                                                    </span>
                                                    <span class="mobile-info-value created-info">
                                                        <strong>{target.createdByName}</strong>
                                                        <span class="created-date-mobile">({target.createdOnDisplay})</span>
                                                    </span>
                                                </div>
                                            </div>

                                            <!-- Card Footer: Prominent Touch Actions with Borders & Spacing -->
                                            <div class="mobile-card-actions">
                                                <lightning-button label="Edit" icon-name="utility:edit"
                                                    variant="neutral" class="mobile-action-btn mobile-edit-btn"
                                                    data-id={target.Id} onclick={handleEdit}></lightning-button>
                                                <lightning-button label="Delete" icon-name="utility:delete"
                                                    variant="neutral" class="mobile-action-btn mobile-delete-btn"
                                                    data-id={target.Id} onclick={handleDelete}></lightning-button>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="mobile-cards-footer">
                                        <span>Total Targets: <strong>{existingTargets.length}</strong></span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template if:false={existingTargets.length}>
                            <div class="empty-targets-state slds-m-horizontal_medium">
                                <div class="empty-targets-icon-wrapper">
                                    <lightning-icon icon-name="utility:target" size="medium"></lightning-icon>
                                </div>
                                <h3 class="empty-targets-title">No Targets Configured</h3>
                                <p class="empty-targets-desc">Get started by creating your first performance target with period-based metrics.</p>
                                <lightning-button label="+ Add Target" variant="brand"
                                    class="slds-m-top_small" onclick={handleAddTarget}></lightning-button>
                            </div>
                        </template>
                    </template>

                    <template if:true={isCreatingTarget}>
                        <div class="wizard-layout-wrapper">

                            <div class="slds-p-around_medium slds-border_bottom">
                                <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
                                    <lightning-progress-step label="Create Target" value="1"></lightning-progress-step>
                                    <lightning-progress-step label="Select Team/Employee"
                                        value="2"></lightning-progress-step>
                                    <lightning-progress-step label="Assign Target" value="3"></lightning-progress-step>
                                </lightning-progress-indicator>
                                <lightning-button-icon icon-name="utility:close"
                                    class="slds-float_right slds-m-top_minus-large" onclick={handleCancel}
                                    variant="bare"></lightning-button-icon>
                            </div>

                            <div class="wizard-content slds-p-around_large slds-size_1-of-1">

                                <template if:true={isStep1}>
                                    <div class="slds-grid slds-wrap slds-gutters_large">
                                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_large">
                                            <lightning-input label="Target Name" required value={targetRecord.Name}
                                                onchange={handleInputChange} data-field="Name"></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_large">
                                            <lightning-combobox label="Select Target Module" required
                                                options={moduleOptions} value={targetRecord.Target_Module__c}
                                                onchange={handleInputChange}
                                                data-field="Target_Module__c"></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_large">
                                            <lightning-combobox label="Frequency" required options={frequencyOptions}
                                                value={targetRecord.Frequency__c} onchange={handleInputChange}
                                                data-field="Frequency__c"></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_large">
                                            <lightning-combobox label="Metric" required options={metricOptions}
                                                value={targetRecord.Metric__c} onchange={handleInputChange}
                                                data-field="Metric__c"></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_large">
                                            <lightning-combobox label="Assign To" required options={assignToOptions}
                                                value={targetRecord.Assign_To_Type__c} onchange={handleInputChange}
                                                data-field="Assign_To_Type__c"></lightning-combobox>
                                        </div>
                                        <template if:true={isTeamTarget}>
                                            <div
                                                class="slds-col slds-size_1-of-1 slds-p-bottom_large slds-m-top_minus-small">
                                                <div class="custom-warning-banner">
                                                    <lightning-icon icon-name="utility:warning" size="x-small"
                                                        class="slds-m-right_small warning-icon"></lightning-icon>
                                                    Target Assigned to Team will be applicable to each employee.
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template if:true={isStep2}>
                                    <div class="slds-grid slds-gutters_large custom-dual-list slds-size_1-of-1">
                                        <div class="slds-col slds-size_1-of-3 right-border-col">

                                            <div
                                                class="slds-grid slds-grid_align-spread slds-p-bottom_small slds-grid_vertical-align-center">
                                                <div class="slds-text-heading_small"><strong>Employees</strong></div>
                                                <lightning-button label="+ Select All" variant="base"
                                                    class="select-btn custom-select-all"
                                                    onclick={handleSelectAll}></lightning-button>
                                            </div>

                                            <lightning-input type="search" value={searchTerm}
                                                placeholder="Search here..." onchange={handleSearch}
                                                class="search-input slds-m-bottom_medium"
                                                variant="label-hidden"></lightning-input>

                                            <template if:true={isLoadingEntities}>
                                                <div class="slds-p-around_medium slds-text-align_center">
                                                    <lightning-spinner alternative-text="Loading"
                                                        size="small"></lightning-spinner>
                                                </div>
                                            </template>

                                            <ul class="user-list slds-scrollable_y">
                                                <template for:each={filteredAvailableEntities} for:item="entity">
                                                    <li key={entity.Id}
                                                        class="slds-p-around_small slds-grid slds-grid_align-spread slds-m-bottom_x-small entity-card">
                                                        <div>
                                                            <div class="slds-text-heading_small">{entity.Name}</div>
                                                            <div class="slds-text-color_weak slds-text-body_small">
                                                                {entity.SubText}</div>
                                                        </div>
                                                        <lightning-button label="+ Select" variant="base"
                                                            class="select-btn" onclick={handleSelectEntity}
                                                            data-id={entity.Id}></lightning-button>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>

                                        <div class="slds-col slds-size_2-of-3 left-pad-col">
                                            <div class="slds-text-heading_small slds-p-bottom_medium"><strong>Selected
                                                    Employees/Teams ({selectedEntities.length})</strong></div>
                                            <ul class="selected-list slds-scrollable_y">
                                                <template for:each={selectedEntities} for:item="sel">
                                                    <li key={sel.Id}
                                                        class="slds-p-around_small slds-m-bottom_small slds-grid slds-grid_align-spread selected-card">
                                                        <div>
                                                            <span
                                                                class="slds-text-heading_small slds-m-right_medium">{sel.Name}</span>
                                                        </div>
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <span
                                                                class="slds-text-color_weak slds-text-body_small slds-m-right_medium">{sel.SubText}</span>
                                                            <lightning-button-icon icon-name="utility:delete"
                                                                variant="bare" class="icon-red"
                                                                onclick={handleRemoveEntity}
                                                                data-id={sel.Id}></lightning-button-icon>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </div>
                                </template>

                                <template if:true={isStep3}>
                                    <template if:true={isTeamTarget}>
                                        <div class="slds-grid slds-grid_align-end slds-p-bottom_small">
                                            <div class="custom-warning-banner inline-banner">
                                                <lightning-icon icon-name="utility:warning" size="x-small"
                                                    class="slds-m-right_small warning-icon"></lightning-icon>
                                                Target Assigned to Team will be applicable to each employee in the Team.
                                            </div>
                                        </div>
                                    </template>
                                    <div class="slds-scrollable_x slds-box slds-theme_default slds-size_1-of-1"
                                        style="max-height: 500px;">
                                        <table
                                            class="slds-table slds-table_cell-buffer slds-table_bordered custom-target-table">
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th class="sticky-col-left" scope="col" style="min-width: 250px;">
                                                        <div class="slds-truncate" title="Employee/Team">Employee</div>
                                                    </th>

                                                    <template for:each={periodColumns} for:item="col">
                                                        <th key={col.id} class="slds-text-align_center" scope="col"
                                                            style="min-width: 120px;">
                                                            <div class="slds-truncate header-green" title={col.label}>
                                                                {col.label}</div>
                                                        </th>
                                                    </template>

                                                    <th class="slds-text-align_right sticky-col-right" scope="col"
                                                        style="width: 80px;">
                                                        <div class="slds-truncate" title="Actions">Actions</div>
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={step3Rows} for:item="row">
                                                    <tr key={row.rowKey} class="no-hover-row">

                                                        <td data-label="Employee"
                                                            class="sticky-col-left slds-theme_default">
                                                            <div class="slds-truncate slds-p-vertical_xx-small"
                                                                style={row.indentStyle}>
                                                                <strong>{row.Name}</strong><br />
                                                                <span class="slds-text-color_weak slds-text-body_small">
                                                                    <template if:true={row.isTeamMember}>
                                                                        <lightning-icon icon-name="utility:user"
                                                                            size="xx-small"
                                                                            class="slds-m-right_xx-small"></lightning-icon>
                                                                    </template>
                                                                    <template if:false={row.isTeamMember}>
                                                                        <lightning-icon icon-name="utility:groups"
                                                                            size="xx-small"
                                                                            class="slds-m-right_xx-small"></lightning-icon>
                                                                    </template>
                                                                    {row.SubText}
                                                                </span>
                                                            </div>
                                                        </td>

                                                        <template for:each={row.periods} for:item="period">
                                                            <td key={period.id}
                                                                class="slds-text-align_center slds-p-around_small">

                                                                <template if:true={period.isPast}>
                                                                    <div class="progress-container">
                                                                        <div class="progress-track">
                                                                            <div class={period.progressClass}
                                                                                style={period.widthStyle}></div>
                                                                        </div>
                                                                        <div class="progress-text">
                                                                            {period.progressAchieved}/{period.progressTarget}
                                                                        </div>
                                                                    </div>
                                                                </template>

                                                                <template if:false={period.isPast}>
                                                                    <lightning-input type="number"
                                                                        variant="label-hidden"
                                                                        placeholder="Enter Quantity"
                                                                        value={period.inputValue}
                                                                        disabled={period.isDisabled}
                                                                        data-empid={row.rowKey}
                                                                        data-periodid={period.id}
                                                                        onchange={handlePeriodInput}
                                                                        class="target-input">
                                                                    </lightning-input>
                                                                </template>

                                                            </td>
                                                        </template>

                                                        <td data-label="Actions"
                                                            class="slds-text-align_right sticky-col-right slds-theme_default">
                                                            <template if:false={row.isTeamMember}>
                                                                <lightning-button-icon icon-name="utility:delete"
                                                                    variant="bare" class="icon-red"
                                                                    onclick={handleRemoveEntity}
                                                                    data-id={row.Id}></lightning-button-icon>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>

                            </div>

                            <div
                                class="wizard-footer slds-border_top slds-p-around_medium slds-grid slds-grid_align-end">
                                <lightning-button label="Cancel" onclick={handleCancel}
                                    class="slds-m-right_small btn-cancel"></lightning-button>
                                <template if:true={showPrevious}>
                                    <lightning-button label="Previous" onclick={handlePrevious}
                                        class="slds-m-right_small btn-previous"></lightning-button>
                                </template>
                                <template if:false={isStep3}>
                                    <lightning-button label="Next" variant="brand" onclick={handleNext}
                                        class="btn-next"></lightning-button>
                                </template>
                                <template if:true={isStep3}>
                                    <lightning-button label="Finish" variant="brand" onclick={handleSave}
                                        class="btn-next"></lightning-button>
                                </template>
                            </div>
                        </div>

                    </template>
                </lightning-tab>
            </template>

        </lightning-tabset>
    </lightning-card>
</template>
